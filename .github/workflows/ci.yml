name: CI, free compatibility and packages

# Pro only works with the free plugin, so every run tests Pro against the free
# plugin (same-named branch if it exists, otherwise main, pinned to the resolved
# commit), runs both together in WordPress Playground and builds both ZIPs.
#
# Pro is paid: keep this repository PRIVATE so only people with access (the
# owner/admins) can download its artifacts. Anyone with read access can download
# artifacts, so grant access to admins only. Artifacts expire after 7 days.
#
# Runner minutes: while this repository is private, nothing runs automatically
# (private repos use paid minutes). Start a run by hand with "Run workflow", or
# build locally with ./bin/build.sh. Free <-> Pro compatibility is still tested
# on every free-repository run and nightly there (public repo, no paid minutes).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FREE_REPO: Vertex-Systems-Network/checkout-impact-regression-for-woocommerce

jobs:
  test:
    name: Lint, Pro tests and free compatibility (PHP ${{ matrix.php }})
    # Automatic only while the repository is public; when private, run it by hand.
    # A skipped run on a private repo is NOT a pass: verify Pro pull requests through
    # the public free repository's CI (same-named branch or the pro_ref input).
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    outputs:
      free_sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        name: Pick the free branch (same name as this branch, else main)
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          sha=$(git ls-remote "https://github.com/$FREE_REPO" "refs/heads/$branch" | cut -f1)
          [ -n "$sha" ] || sha=$(git ls-remote "https://github.com/$FREE_REPO" refs/heads/main | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Testing against $FREE_REPO@$sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FREE_REPO }}
          ref: ${{ steps.ref.outputs.sha }}
          path: free-repo
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Lint PHP and JavaScript
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -not -path './free-repo/*' -not -path './build/*' -print0 | xargs -0 -n1 php -l > /dev/null
          node --check assets/pro.js
      - name: readme.txt is generated from wordpress-org/readme.md
        run: php tools/readme-to-txt.php --check
      - name: Pro tests
        run: php tests/pro-contract.php
      - name: Free plugin still provides everything Pro uses
        run: FREE_DIR=free-repo php tests/free-api-contract.php

  package:
    name: Build Pro + free ZIPs
    needs: test
    runs-on: ubuntu-latest
    steps:
      - id: vis
        name: Only private repositories may publish Pro artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          echo "visibility=$visibility" >> "$GITHUB_OUTPUT"
          if [ "$visibility" != "private" ]; then
            echo "::warning::This repository is $visibility, so the Pro ZIP is built and checked but NOT uploaded. Make the repository private to get downloadable packages (admins only, D-025)."
          fi
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FREE_REPO }}
          ref: ${{ needs.test.outputs.free_sha }}
          path: free-repo
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Build both packages
        run: FREE_DIR=free-repo ./bin/build.sh
      - name: Upload Pro + free packages (private repository only)
        if: steps.vis.outputs.visibility == 'private'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-packages
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Pro + free together in WordPress Playground (PHP ${{ matrix.php }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FREE_REPO }}
          ref: ${{ needs.test.outputs.free_sha }}
          path: free-repo
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build both in this job (nothing is uploaded) and run the integration check
        run: |
          FREE_DIR=free-repo ./bin/build.sh >/dev/null
          tests/integration/run.sh free-repo/build/checkout-impact-regression-for-woocommerce build/checkout-impact-regression-pro-for-woocommerce ${{ matrix.php }}

  notify-free:
    name: Ask the free repository to re-test
    needs: [package, integration]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pro-updated to free (needs CROSS_REPO_TOKEN secret)
        env:
          TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "CROSS_REPO_TOKEN not set; free re-tests on its own nightly schedule instead." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$FREE_REPO/dispatches" \
            -d "{\"event_type\":\"pro-updated\",\"client_payload\":{\"sha\":\"$GITHUB_SHA\"}}"
